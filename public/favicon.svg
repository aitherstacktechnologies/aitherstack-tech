<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A100C"/>
      <stop offset="100%" stop-color="#0D0B0A"/>
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F36B3F"/>
      <stop offset="50%" stop-color="#FF9A78"/>
      <stop offset="100%" stop-color="#F36B3F"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="url(#bgGrad)"/>
  
  <!-- AST geometric symbol - triangular arrow pointing up-right -->
  <g transform="translate(96, 96)">
    <!-- Main triangular shape -->
    <path d="M-32 40 L0 -50 L32 40 Z" fill="url(#symbolGrad)" stroke="none"/>
    
    <!-- Inner accent triangle -->
    <path d="M-16 20 L0 -25 L16 20 Z" fill="url(#symbolGrad)" opacity="0.7"/>
    
    <!-- Central dot -->
    <circle cx="0" cy="8" r="4" fill="#FF9A78"/>
  </g>
  
  <!-- Subtle ring -->
  <circle cx="96" cy="96" r="88" fill="none" stroke="#F36B3F" stroke-width="1.5" opacity="0.3"/>
</svg>