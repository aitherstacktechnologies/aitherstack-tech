<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0B0A"/>
      <stop offset="50%" style="stop-color:#1A100C"/>
      <stop offset="100%" style="stop-color:#0D0B0A"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F36B3F"/>
      <stop offset="50%" style="stop-color:#FF9A78"/>
      <stop offset="100%" style="stop-color:#F36B3F"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Subtle pattern overlay -->
  <rect width="1200" height="630" fill="url(#pattern)" opacity="0.03"/>
  <defs>
    <pattern id="pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1" fill="#FF9A78"/>
    </pattern>
  </defs>
  
  <!-- Decorative gradient orbs -->
  <ellipse cx="200" cy="150" rx="300" ry="200" fill="#F36B3F" opacity="0.08" filter="url(#glow)"/>
  <ellipse cx="1000" cy="480" rx="250" ry="180" fill="#FF9A78" opacity="0.06" filter="url(#glow)"/>
  
  <!-- Logo area -->
  <g transform="translate(120, 180)">
    <!-- Logo placeholder - using text representation -->
    <circle cx="60" cy="60" r="60" fill="#1A100C" stroke="#F36B3F" stroke-width="2"/>
    <text x="60" y="72" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#F36B3F" text-anchor="middle">AST</text>
  </g>
  
  <!-- Main content -->
  <g transform="translate(280, 180)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#F4EDE3" text-anchor="start">Aither Stack Technologies</text>
    <text x="0" y="60" font-family="Georgia, serif" font-size="28" fill="#FF9A78" text-anchor="start">Web Engineering • AI Systems • Automation</text>
  </g>
  
  <!-- Divider line -->
  <line x1="280" y1="320" x2="920" y2="320" stroke="url(#accentGradient)" stroke-width="3" opacity="0.5"/>
  
  <!-- Description -->
  <g transform="translate(280, 360)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="22" fill="#9A8A7A" text-anchor="start">Premium digital systems for ambitious brands</text>
    <text x="0" y="35" font-family="'Inter', sans-serif" font-size="22" fill="#9A8A7A" text-anchor="start">High-performance websites • AI voice agents • Automation workflows</text>
  </g>
  
  <!-- CTA indicator -->
  <g transform="translate(280, 450)">
    <rect x="0" y="0" width="220" height="56" rx="28" fill="url(#accentGradient)" filter="url(#glow)"/>
    <text x="110" y="38" font-family="'Inter', sans-serif" font-size="18" font-weight="600" fill="#0D0B0A" text-anchor="middle">Book a Strategy Call</text>
  </g>
  
  <!-- Bottom brand -->
  <g transform="translate(600, 580)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-size="14" fill="#5A4A3A" text-anchor="middle" letter-spacing="2">AITHER STACK TECHNOLOGIES</text>
  </g>
</svg>